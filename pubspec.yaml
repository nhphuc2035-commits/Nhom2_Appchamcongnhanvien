name: nhom2_appchamcongnhanvien
description: "Nhom2 - Ứng dụng Di động Điểm danh & Quản trị Nhân sự (Appchamcongnhanvien)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.2.2
  flutter_dotenv: ^5.2.1

  # Local Storage & JWT
  shared_preferences: ^2.3.2
  jwt_decoder: ^2.0.1

  # Sinh trắc học & Lưu trữ an toàn (Biometrics Storage)
  local_auth: ^2.3.0
  biometric_storage:
    path: packages/biometric_storage

  # Format ngày tháng, tiền tệ
  intl: ^0.19.0

  # Chụp ảnh Selfie đối soát khoảnh khắc chấm công
  image_picker: ^1.2.4

  # Định vị GPS & Radar Bán kính văn phòng công ty
  geolocator: ^14.0.2
  flutter_local_notifications: ^22.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Cấu hình assets để đọc file .env
  assets:
    - .env
